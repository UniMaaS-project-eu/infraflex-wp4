      - EDC_MONITOR_LEVEL=DEBUG
      - EDC_VAULT_HASHICORP_URL=http://edc-vault-${ED_NODE_INSTANCE_NAME:-connectorcp}:8200
      - EDC_VAULT_CERTIFICATE_RESOLVER_ENABLED=true
      - EDC_VAULT_PRIVATEKEY_RESOLVER_ENABLED=true
      - UNIMAAS_ISSUERSERVICEVC_PROTOCOL=${UNIMAAS_ISSUERSERVICEVC_PROTOCOL:-http}
      - UNIMAAS_ISSUERSERVICEVC_HOST=${UNIMAAS_ISSUERSERVICEVC_HOST:-edc-proxy-issuerservicevc}
