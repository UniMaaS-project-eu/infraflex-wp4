      - EDC_DATASOURCE_IDENTITYHUB_USER=identityhub_user
      - EDC_DATASOURCE_IDENTITYHUB_PASSWORD=identityhub_password
      - EDC_SQL_SCHEMA_AUTOCREATE=true
      - EDC_SQL_POOL_CONNECTIONS_MAX=10
