      - EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS=${CONNECTOR2_DID:-did:web:edc-proxy-connector2%3A80:connector2}-sts-client-secret
      - EDC_IAM_STS_OAUTH_TOKEN_URL=http://edc-ih-connector2:7095/api/sts/token
      - EDC_IAM_IDENTITYHUB_URL=http://edc-ih-connector2:7093
      - EDC_IAM_IDENTITYHUB_DID=${CONNECTOR2_DID:-did:web:edc-proxy-connector2%3A80:connector2}
      - EDC_DATAPLANE_API_PUBLIC_BASEURL=http://connector2:9091/public
      - EDC_DATAPLANE_SIGNALING_API_URL=http://connector2:9092/api/signaling
      - EDC_DATAPLANE_TOKEN_VALIDATION_ENDPOINT=http://connector2:8083/api/control/v3/dataplane/token
      - EDC_CONTROLPLANE_VALIDATION_ENDPOINT=http://connector2:8083/api/control/v3/dataplane/token
      - EDC_DATAPLANE_PROXY_PUBLIC_ENDPOINT=http://connector2:11001/api/public
      - EDC_DATAPLANE_API_INSTANCE_ID=${CONNECTOR2_DID:-did:web:edc-proxy-connector2%3A80:connector2}
      - EDC_DPF_SELECTOR_URL=http://connector2:8083/api/control/v3/dataplanes
      - EDC_LOG_LEVEL=DEBUG
      - EDC_WEB_REST_CORS_ENABLED=true
      - EDC_MONITOR_LEVEL=DEBUG
      - UNIMAAS_ISSUERSERVICEVC_DID=${UNIMAAS_ISSUERSERVICEVC_DID:-did:web:edc-proxy-issuerservicevc%3A80:issuerservicevc}
      - UNIMAAS_MOCKREGISTRY_CONTEXT_URL=${MOCKREGISTRY_CONTEXT_URL:-http://mock-registry:8080/main/context/2411}
      - UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST=${CONNECTOR_UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST:-true}
      - EDC_VAULT_HASHICORP_URL=http://edc-vault-connector2:8200
      - XACML_VALIDATION_ENABLED=${XACML_VALIDATION_ENABLED:-false}
      - XACML_PDP_ENDPOINT=${XACML_PDP_ENDPOINT:-http://localhost:9092/pdp/verdict}
      - XACML_DOMAIN=${XACML_DOMAIN:-unimaas}
      - EDC_VAULT_CERTIFICATE_RESOLVER_ENABLED=true
      - EDC_VAULT_PRIVATEKEY_RESOLVER_ENABLED=true
      - EDC_DATASOURCE_DEFAULT_NAME=default
      - EDC_DATASOURCE_DEFAULT_URL=jdbc:postgresql://edc-postgres-connector2:5432/edc
      - EDC_DATASOURCE_DEFAULT_USER=edc_user
      - EDC_DATASOURCE_DEFAULT_PASSWORD=edc_password
      - EDC_DATASOURCE_ASSET_NAME=asset
      - EDC_DATASOURCE_ASSET_URL=jdbc:postgresql://edc-postgres-connector2:5432/edc
      - EDC_DATASOURCE_ASSET_USER=edc_user
      - EDC_DATASOURCE_ASSET_PASSWORD=edc_password
      - EDC_DATASOURCE_CONTRACTDEFINITION_NAME=contractdefinition
      - EDC_DATASOURCE_CONTRACTDEFINITION_URL=jdbc:postgresql://edc-postgres-connector2:5432/edc
      - EDC_DATASOURCE_CONTRACTDEFINITION_USER=edc_user
      - EDC_DATASOURCE_CONTRACTDEFINITION_PASSWORD=edc_password
      - EDC_DATASOURCE_POLICY_NAME=policy
      - EDC_DATASOURCE_POLICY_URL=jdbc:postgresql://edc-postgres-connector2:5432/edc
      - EDC_DATASOURCE_POLICY_USER=edc_user
      - EDC_DATASOURCE_POLICY_PASSWORD=edc_password
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_NAME=contractnegotiation
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_URL=jdbc:postgresql://edc-postgres-connector2:5432/edc
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_USER=edc_user
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_PASSWORD=edc_password
      - EDC_DATASOURCE_TRANSFERPROCESS_NAME=transferprocess
      - EDC_DATASOURCE_TRANSFERPROCESS_URL=jdbc:postgresql://edc-postgres-connector2:5432/edc
      - EDC_DATASOURCE_TRANSFERPROCESS_USER=edc_user
      - EDC_DATASOURCE_TRANSFERPROCESS_PASSWORD=edc_password
