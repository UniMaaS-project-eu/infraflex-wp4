      - UNIMAAS_CREDENTIALS_RENEWAL_ENABLED=${UNIMAAS_CREDENTIALS_RENEWAL_ENABLED:-true}
      - UNIMAAS_CREDENTIALS_RENEWAL_CHECK_INTERVAL_MINUTES=${UNIMAAS_CREDENTIALS_RENEWAL_CHECK_INTERVAL_MINUTES:-1440}
      - UNIMAAS_CREDENTIALS_RENEWAL_EXPIRY_THRESHOLD_DAYS=${UNIMAAS_CREDENTIALS_RENEWAL_EXPIRY_THRESHOLD_DAYS:-30}
