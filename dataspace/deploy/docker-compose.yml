      - EDC_PARTICIPANT_ID=${ED_NODE_DID:-did:web:edc-proxy-connectorcp%3A80:connectorcp}
      - EDC_IH_API_SUPERUSER_KEY=${IH_API_KEY:-c3VwZXItdXNlcg==.c3VwZXItc2VjcmV0LWtleQo=}
