      - EDC_SQL_POOL_CONNECTIONS_MIN=3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/check/health || curl -s http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ============================================================================
  # SECTION 3C: ED-NODE CONNECTORCP STACK (Central Platform Consumer - Port 9878, 7090-7095, 8390-8395)
  # ============================================================================
  edc-proxy:
    image: nginx:alpine
    hostname: edc-proxy-${ED_NODE_INSTANCE_NAME:-connectorcp}
    container_name: edc-proxy-${ED_NODE_INSTANCE_NAME:-connectorcp}
    ports:
      - "${CONNECTORCP_NGINX_PORT:-9878}:80"
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/deployment/nginx/nginx-${ED_NODE_INSTANCE_NAME:-connectorcp}.conf:/etc/nginx/nginx.conf:ro
      - ${REPOS_DIR:-./repos}/ed-node/deployment/assets/dids/:/var/www/:ro
    networks:
      edc-network:
        aliases:
          - edc-proxy-${ED_NODE_INSTANCE_NAME:-connectorcp}
          - proxy-${ED_NODE_INSTANCE_NAME:-connectorcp}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  edc-postgres-connector:
    image: postgres:15-alpine
    hostname: edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}
    container_name: edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}
    networks:
      edc-network:
        aliases:
          - edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}
    restart: unless-stopped
    volumes:
      - edc_postgres_data:/var/lib/postgresql/data
      - ${REPOS_DIR:-./repos}/ed-node/launchers/postgresql-init/01-init-edc-all.sql:/docker-entrypoint-initdb.d/01-init-edc-all.sql:ro
      - ${REPOS_DIR:-./repos}/ed-node/launchers/postgresql-init/02-init-vault-all.sql:/docker-entrypoint-initdb.d/02-init-vault-all.sql:ro
      - ${REPOS_DIR:-./repos}/ed-node/launchers/postgresql-init/03-init-identityhub-all.sql:/docker-entrypoint-initdb.d/03-init-identityhub-all.sql:ro
    environment:
      POSTGRES_DB: edc
      POSTGRES_USER: edc_user
      POSTGRES_PASSWORD: edc_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc_user -d edc"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  edc-vault-connector:
    image: hashicorp/vault:1.15
    hostname: edc-vault-${ED_NODE_INSTANCE_NAME:-connectorcp}
    container_name: edc-vault-${ED_NODE_INSTANCE_NAME:-connectorcp}
    networks:
      edc-network:
        aliases:
          - edc-vault-${ED_NODE_INSTANCE_NAME:-connectorcp}
    restart: unless-stopped
    depends_on:
      edc-postgres-connector:
        condition: service_healthy
    environment:
      VAULT_SKIP_VERIFY: "true"
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/deployment/vault/${ED_NODE_INSTANCE_NAME:-connectorcp}/vault-${ED_NODE_INSTANCE_NAME:-connectorcp}-config.json:/vault/custom/local.json
      - vault_init_data:/vault
    cap_add:
      - IPC_LOCK
    command: "server -config=/vault/custom/local.json"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 2>&1 | grep -E '(Sealed.*false|Initialized.*true)' || echo 'Vault not ready'"]
      interval: 10s
      timeout: 35s
      retries: 30
      start_period: 20s

  edc-vault-init-connector:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: launchers/vault-init/Dockerfile.vault-init
    image: unimaas/vault-init:1.0
    hostname: edc-vault-init-${ED_NODE_INSTANCE_NAME:-connectorcp}
    container_name: edc-vault-init-${ED_NODE_INSTANCE_NAME:-connectorcp}
    depends_on:
      edc-vault-connector:
        condition: service_healthy
      edc-postgres-connector:
        condition: service_healthy
    networks:
      edc-network:
        aliases:
          - edc-vault-init-${ED_NODE_INSTANCE_NAME:-connectorcp}
    restart: "no"
    entrypoint: sh /vault/vault-init.sh http://edc-vault-${ED_NODE_INSTANCE_NAME:-connectorcp}:8200 ${ED_NODE_DID:-did:web:edc-proxy-connectorcp%3A80:connectorcp} edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}:5432
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/launchers/vault-init/vault-init.sh:/vault/vault-init.sh
      - ${REPOS_DIR:-./repos}/ed-node/deployment/assets/keysPrivPub/${ED_NODE_INSTANCE_NAME:-connectorcp}/${ED_NODE_INSTANCE_NAME:-connectorcp}_private.pem:/vault/keys/private-key.pem
      - ${REPOS_DIR:-./repos}/ed-node/deployment/assets/keysPrivPub/${ED_NODE_INSTANCE_NAME:-connectorcp}/${ED_NODE_INSTANCE_NAME:-connectorcp}_public.pem:/vault/keys/certificate.pem
      - vault_init_data:/vault

  edc-vault-autounseal:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: launchers/vault-autounseal/Dockerfile.vault-autounseal
    image: unimaas/vault-autounseal:1.0
    hostname: edc-vault-autounseal-${ED_NODE_INSTANCE_NAME:-connectorcp}
    container_name: edc-vault-autounseal-${ED_NODE_INSTANCE_NAME:-connectorcp}
    depends_on:
      edc-vault-connector:
        condition: service_started
      edc-vault-init-connector:
        condition: service_completed_successfully
    networks:
      edc-network:
        aliases:
          - edc-vault-autounseal-${ED_NODE_INSTANCE_NAME:-connectorcp}
    restart: unless-stopped
    environment:
      - VAULT_ADDR=http://edc-vault-${ED_NODE_INSTANCE_NAME:-connectorcp}:8200
      - CHECK_INTERVAL=10
    volumes:
      - vault_init_data:/vault:ro
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q autounseal.sh || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ih-connector:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: launchers/identity-hub/src/main/docker/Dockerfile_identityhub
    image: unimaas/edc-identityhub:1.0
