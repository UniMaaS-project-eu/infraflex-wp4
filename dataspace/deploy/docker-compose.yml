      - EDC_DATASOURCE_DEFAULT_PASSWORD=edc_password
      - EDC_DATASOURCE_ASSET_NAME=asset
      - EDC_DATASOURCE_ASSET_URL=jdbc:postgresql://edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}:5432/edc
      - EDC_DATASOURCE_ASSET_USER=edc_user
      - EDC_DATASOURCE_ASSET_PASSWORD=edc_password
      - EDC_DATASOURCE_CONTRACTDEFINITION_NAME=contractdefinition
      - EDC_DATASOURCE_CONTRACTDEFINITION_URL=jdbc:postgresql://edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}:5432/edc
      - EDC_DATASOURCE_CONTRACTDEFINITION_USER=edc_user
      - EDC_DATASOURCE_CONTRACTDEFINITION_PASSWORD=edc_password
      - EDC_DATASOURCE_POLICY_NAME=policy
      - EDC_DATASOURCE_POLICY_URL=jdbc:postgresql://edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}:5432/edc
      - EDC_DATASOURCE_POLICY_USER=edc_user
      - EDC_DATASOURCE_POLICY_PASSWORD=edc_password
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_NAME=contractnegotiation
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_URL=jdbc:postgresql://edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}:5432/edc
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_USER=edc_user
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_PASSWORD=edc_password
      - EDC_DATASOURCE_TRANSFERPROCESS_NAME=transferprocess
      - EDC_DATASOURCE_TRANSFERPROCESS_URL=jdbc:postgresql://edc-postgres-${ED_NODE_INSTANCE_NAME:-connectorcp}:5432/edc
      - EDC_DATASOURCE_TRANSFERPROCESS_USER=edc_user
      - EDC_DATASOURCE_TRANSFERPROCESS_PASSWORD=edc_password
      - EDC_SQL_SCHEMA_AUTOCREATE=true
      - EDC_SQL_POOL_CONNECTIONS_MAX=10
      - EDC_SQL_POOL_CONNECTIONS_MIN=3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/check/health || curl -s http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ============================================================================
  # SECTION 4: CENTRAL KNOWLEDGE GRAPH & DMS STACK (central-kg & ids-mvd-dms)
  # ============================================================================
  central-platform-graphdb:
    hostname: central-platform-graphdb
    image: ontotext/graphdb:10.3.3
    container_name: central-platform-graphdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:7200/protocol || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    environment:
      GDB_HEAP_SIZE: 4g
      GDB_MIN_MEM: 1g
      GDB_MAX_MEM: 4g
      GRAPHDB_SECURITY: "true"
      GRAPHDB_ADMIN_PASSWORD: "${GRAPHDB_ADMIN_PASSWORD:-mypassword}"
    ports:
      - "${CENTRAL_GRAPHDB_PORT:-7200}:7200"
    volumes:
      - central_graphdb_data:/opt/graphdb/home
      - ${REPOS_DIR:-./repos}/central-kg/graphdb/config:/config
    networks:
      - edc-network

  central-platform-postgres:
    hostname: central-platform-postgres
    image: postgres:18
    container_name: central-platform-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-postgrescp}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgrescp}
    volumes:
      - central_postgres_data:/var/lib/postgresql
    ports:
      - "${CENTRAL_POSTGRES_PORT:-5432}:5432"
    networks:
      - edc-network

  fuseki-server-provider:
    image: stain/jena-fuseki
    container_name: fuseki-server-provider
    hostname: fuseki-server-provider
    user: "0:0"
    restart: unless-stopped
    ports:
      - "${FUSEKI_PROVIDER_PORT:-3032}:3030"
    volumes:
      - ${REPOS_DIR:-./repos}/ids-mvd-dms/fuseki/provider/config.ttl:/fuseki/config.ttl:ro
      - fuseki_provider_data:/fuseki/databases
      - ${REPOS_DIR:-./repos}/ids-mvd-dms/fuseki/provider/shiro.ini:/fuseki/shiro.ini:ro
    command: ["/jena-fuseki/fuseki-server", "--config=/fuseki/config.ttl"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3030/\\$/ping || curl -sf -u admin:mypassword 'http://localhost:3030/provider/query?query=ASK%7B%3Fs%20%3Fp%20%3Fo%7D' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - edc-network

  central-platform-federated-catalog:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: ../../dockerfiles/Dockerfile.federated-catalog
    image: standalone-federated-catalog:latest
    hostname: central-platform-federated-catalog
    container_name: central-platform-federated-catalog
    restart: unless-stopped
    depends_on:
      connector:
        condition: service_healthy
      ih-connector:
        condition: service_healthy
      central-platform-postgres:
        condition: service_healthy
    volumes:
      - vault_init_data:/vault-token:ro
      - ${REPOS_DIR:-./repos}/central-kg/env/standalone-catalog.env:/etc/app/env-file:ro
    networks:
      - edc-network
    ports:
      - "${CATALOG_PORT:-8184}:8184"
      - "${CATALOG_MGMT_PORT:-8181}:8181"
    environment:
      - EDC_IAM_IDENTITYHUB_URL=http://edc-ih-${ED_NODE_INSTANCE_NAME:-connectorcp}:7093
      - EDC_IAM_IDENTITYHUB_DID=${ED_NODE_DID:-did:web:edc-proxy-connectorcp%3A80:connectorcp}
      - EDC_CONTROLPLANE_VALIDATION_ENDPOINT=http://${ED_NODE_INSTANCE_NAME:-connectorcp}:8083/api/control/v3/dataplane/token
      - EDC_LOG_LEVEL=DEBUG
      - EDC_WEB_REST_CORS_ENABLED=true
      - EDC_MONITOR_LEVEL=DEBUG
      - UNIMAAS_ISSUERSERVICEVC_DID=${UNIMAAS_ISSUERSERVICEVC_DID:-did:web:edc-proxy-issuerservicevc%3A80:issuerservicevc}
      - UNIMAAS_MOCKREGISTRY_CONTEXT_URL=${MOCKREGISTRY_CONTEXT_URL:-http://mock-registry:8080/main/context/2411}
      - UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST=${CONNECTOR_UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST:-true}

  central-platform-digital-thread:
    build:
      context: ${REPOS_DIR:-./repos}/ids-mvd-dms
      dockerfile: ../../dockerfiles/Dockerfile.digital-thread
    image: digital-thread:latest
    hostname: central-platform-digital-thread
    container_name: central-platform-digital-thread
    restart: unless-stopped
    depends_on:
      central-platform-graphdb:
        condition: service_healthy
      central-platform-postgres:
        condition: service_healthy
      central-platform-federated-catalog:
        condition: service_started
    env_file:
      - ${REPOS_DIR:-./repos}/central-kg/env/digital_thread.env
    volumes:
      - ${REPOS_DIR:-./repos}/ids-mvd-dms/deployment/config/demo_dms.json:/etc/app/demo_dms.json:ro
    networks:
      - edc-network

  central-platform-kg-api:
    build:
      context: ${REPOS_DIR:-./repos}/central-kg/centralKG_API
      dockerfile: ../../../dockerfiles/Dockerfile.centralkg-api
    image: centralkg-api:latest
    hostname: central-platform-kg-api
    container_name: central-platform-kg-api
    restart: unless-stopped
    depends_on:
      central-platform-graphdb:
        condition: service_healthy
    env_file:
      - ${REPOS_DIR:-./repos}/central-kg/centralKG_API/api.env
    ports:
      - "${CENTRAL_KG_API_PORT:-8000}:8000"
    networks:
      - edc-network

volumes:
  infraflex_graphdb_data:
  central_graphdb_data:
  central_postgres_data:
  edc_postgres_data:
  edc_postgres_data_connector1:
  edc_postgres_data_connector2:
  vault_init_data:
  vault_init_data_connector1:
  vault_init_data_connector2:
  keycloak_data:
  fuseki_provider_data:

networks:
  edc-network:
    name: edc-network
    driver: bridge
