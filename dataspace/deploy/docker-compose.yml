name: unimaas-unified

services:
  # ============================================================================
  # SECTION 1: INFRAFLEX & ECLIPSE BASYX STACK (unimaas-infraflex)
  # ============================================================================
  aas-env:
    image: eclipsebasyx/aas-environment:2.0.0-SNAPSHOT
    container_name: aas-env
    environment:
      - SERVER_PORT=8081
      - BASYX_EXTERNALURL=http://${EXTERNAL_HOST:-localhost}:${AAS_ENV_PORT:-8081}
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/basyx-setup/aas:/application/aas
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/basyx-setup/basyx/aas-env.properties:/application/application.properties
    ports:
      - "${AAS_ENV_PORT:-8081}:8081"
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      aas-registry:
        condition: service_healthy
      sm-registry:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  aas-registry:
    image: eclipsebasyx/aas-registry-log-mongodb:2.0.0-SNAPSHOT
    container_name: aas-registry
    ports:
      - "${AAS_REGISTRY_PORT:-8082}:8080"
    environment:
      - SERVER_PORT=8080
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/basyx-setup/basyx/aas-registry.yml:/workspace/config/application.yml
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      mongo:
        condition: service_healthy

  sm-registry:
    image: eclipsebasyx/submodel-registry-log-mongodb:2.0.0-SNAPSHOT
    container_name: sm-registry
    ports:
      - "${SM_REGISTRY_PORT:-8083}:8080"
    environment:
      - SERVER_PORT=8080
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/basyx-setup/basyx/sm-registry.yml:/workspace/config/application.yml
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      mongo:
        condition: service_healthy

  aas-discovery:
    image: eclipsebasyx/aas-discovery:2.0.0-SNAPSHOT
    container_name: aas-discovery
    environment:
      - SERVER_PORT=8081
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/basyx-setup/basyx/aas-discovery.properties:/application/application.properties
    ports:
      - "${AAS_DISCOVERY_PORT:-8084}:8081"
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:5.0.10
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    restart: unless-stopped
    networks:
      - edc-network
    healthcheck:
      test: mongo
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0.15
    container_name: mosquitto
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/basyx-setup/mosquitto:/mosquitto
    restart: unless-stopped
    networks:
      - edc-network
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -p 1883 -t 'topic' -C 1 -E -i probe -W 3
      interval: 5s
      timeout: 10s
      start_period: 1s
      retries: 3

  aas-web-ui:
    image: eclipsebasyx/aas-gui:SNAPSHOT
    container_name: aas-ui
    ports:
      - "${AAS_UI_PORT:-3000}:3000"
    environment:
      AAS_REGISTRY_PATH: http://${EXTERNAL_HOST:-localhost}:${AAS_REGISTRY_PORT:-8082}/shell-descriptors
      SUBMODEL_REGISTRY_PATH: http://${EXTERNAL_HOST:-localhost}:${SM_REGISTRY_PORT:-8083}/submodel-descriptors
      AAS_REPO_PATH: http://${EXTERNAL_HOST:-localhost}:${AAS_ENV_PORT:-8081}/shells
      SUBMODEL_REPO_PATH: http://${EXTERNAL_HOST:-localhost}:${AAS_ENV_PORT:-8081}/submodels
      CD_REPO_PATH: http://${EXTERNAL_HOST:-localhost}:${AAS_ENV_PORT:-8081}/concept-descriptions
      AAS_DISCOVERY_PATH: http://${EXTERNAL_HOST:-localhost}:${AAS_DISCOVERY_PORT:-8084}/lookup/shells
      DASHBOARD_SERVICE_PATH: http://${EXTERNAL_HOST:-localhost}:${DASHBOARD_API_PORT:-8085}/api/elements
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      aas-env:
        condition: service_healthy

  dashboard-api:
    image: aaronzi/basyx-dashboard-api:SNAPSHOT_02
    container_name: dashboard-api
    environment:
      - BASYX_EXTERNALURL=http://${EXTERNAL_HOST:-localhost}:${DASHBOARD_API_PORT:-8085}
    ports:
      - "${DASHBOARD_API_PORT:-8085}:8085"
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/basyx-setup/basyx/aas-dashboard.yml:/application.yml
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      mongo:
        condition: service_healthy

  infraflex-graphdb:
    image: ontotext/graphdb:10.8.0
    container_name: infraflex-graphdb
    hostname: infraflex-graphdb
    ports:
      - "${INFRAFLEX_GRAPHDB_PORT:-7201}:7200"
    environment:
      GDB_JAVA_OPTS: "-Xmx2g"
    volumes:
      - infraflex_graphdb_data:/opt/graphdb/home
    restart: unless-stopped
    networks:
      edc-network:
        aliases:
          - infraflex-graphdb
          - graphdb
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f -s http://localhost:7200/rest/repositories || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${EXTERNAL_HOST:-localhost}:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr internal://0.0.0.0:8083,external://0.0.0.0:18083
      - --advertise-pandaproxy-addr internal://redpanda:8083,external://${EXTERNAL_HOST:-localhost}:${REDPANDA_PROXY_PORT:-18083}
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_PROXY_PORT:-18083}:18083"
    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health | grep -E 'Healthy:.+true' || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - edc-network

  unimaas-infraflex:
    build:
      context: ${REPOS_DIR:-./repos}/unimaas-infraflex
      dockerfile: Dockerfile
    container_name: unimaas-infraflex
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      BASYX_AAS_REPO: http://aas-env:8081
      BASYX_SUBMODEL_REPO: http://aas-env:8081
      BASYX_AAS_REGISTRY: http://aas-registry:8080
      GRAPHDB_URL: http://infraflex-graphdb:7200
      GRAPHDB_REPOSITORY: ${INFRAFLEX_GRAPHDB_REPO:-infraflex}
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/unimaas_infraflex:/app/unimaas_infraflex
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/scripts:/app/scripts
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/AAS:/app/AAS
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/ontologies:/app/ontologies
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      aas-env:
        condition: service_healthy
      infraflex-graphdb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  infraplay:
    build:
      context: ${REPOS_DIR:-./repos}/unimaas-infraflex
      dockerfile: Dockerfile
    container_name: infraplay
    working_dir: /app
    entrypoint: ["python", "-m", "infraplay", "web", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      BASYX_AAS_REPO: http://aas-env:8081
    ports:
      - "${INFRAPLAY_PORT:-8090}:8090"
    volumes:
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/infraplay:/app/infraplay
      - ${REPOS_DIR:-./repos}/unimaas-infraflex/AAS:/app/AAS
    restart: unless-stopped
    networks:
      - edc-network
    depends_on:
      aas-env:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  # ============================================================================
  # SECTION 2: DATASPACE IDENTITY, DIRECTORY & VC ISSUER (ed-node & ids-mvd-dms)
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: keycloak
    hostname: keycloak
    networks:
      - edc-network
    ports:
      - "${KEYCLOAK_PORT:-5080}:8080"
      - "${KEYCLOAK_HTTPS_PORT:-5443}:8443"
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ${REPOS_DIR:-./repos}/ids-mvd-dms/keycloak/realm-import:/opt/keycloak/data/import:ro
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command:
      - start-dev
      - --import-realm

  mock-registry:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node/tests/mock-registry
      dockerfile: Dockerfile
    hostname: mock-registry
    container_name: mock-registry
    ports:
      - "${MOCKREGISTRY_EXPOSED_PORT:-8089}:8080"
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/tests/mock-registry/contexts:/app/contexts:ro
    networks:
      - edc-network
    restart: unless-stopped
    environment:
      - CONTEXT_URL=${CONTEXT_URL:-http://mock-registry:8080/main/context/2411}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  issuerservicevc:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: tests/issuerservice-vc/Dockerfile
    image: unimaas/issuerservice-vc:1.0
    hostname: issuerservicevc
    container_name: issuerservicevc
    restart: unless-stopped
    environment:
      - ISSUER_DID=${UNIMAAS_ISSUERSERVICEVC_DID:-did:web:edc-proxy-issuerservicevc%3A80:issuerservicevc}
      - VC_CONTEXT_URL=${VC_CONTEXT_URL:-http://mock-registry:8080/main/context/2411}
      - EXPIRY_DAYS=${EXPIRY_DAYS:-365}
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/tests/issuerservice-vc/assets/keysPrivPub/${ISSUERSERVICEVC_INSTANCE_NAME:-issuerservicevc}/${ISSUERSERVICEVC_INSTANCE_NAME:-issuerservicevc}_private.pem:/app/keys/issuer_private.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      edc-network:
        aliases:
          - issuerservicevc

  edc-proxy-issuerservicevc:
    image: nginx:alpine
    hostname: edc-proxy-issuerservicevc
    container_name: edc-proxy-issuerservicevc
    ports:
      - "${ISSUERSERVICEVC_EXPOSED_PORT:-7000}:80"
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/tests/issuerservice-vc/nginx/nginx-${ISSUERSERVICEVC_INSTANCE_NAME:-issuerservicevc}.conf:/etc/nginx/nginx.conf:ro
      - ${REPOS_DIR:-./repos}/ed-node/tests/issuerservice-vc/assets/dids/${ISSUERSERVICEVC_INSTANCE_NAME:-issuerservicevc}/:/var/www/${ISSUERSERVICEVC_INSTANCE_NAME:-issuerservicevc}/:ro
    networks:
      edc-network:
        aliases:
          - edc-proxy-issuerservicevc
          - proxy-issuerservicevc
    restart: unless-stopped
    depends_on:
      issuerservicevc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # SECTION 3A: ED-NODE CONNECTOR1 STACK (Provider 1 - Port 9876, 7190-7195, 8190-8195)
  # ============================================================================
  edc-proxy-connector1:
    image: nginx:alpine
    hostname: edc-proxy-connector1
    container_name: edc-proxy-connector1
    ports:
      - "${CONNECTOR1_NGINX_PORT:-9876}:80"
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/deployment/nginx/nginx-connector1.conf:/etc/nginx/nginx.conf:ro
      - ${REPOS_DIR:-./repos}/ed-node/deployment/assets/dids/:/var/www/:ro
    networks:
      edc-network:
        aliases:
          - edc-proxy-connector1
          - proxy-connector1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  edc-postgres-connector1:
    image: postgres:15-alpine
    hostname: edc-postgres-connector1
    container_name: edc-postgres-connector1
    networks:
      edc-network:
        aliases:
          - edc-postgres-connector1
    restart: unless-stopped
    volumes:
      - edc_postgres_data_connector1:/var/lib/postgresql/data
      - ${REPOS_DIR:-./repos}/ed-node/launchers/postgresql-init/01-init-edc-all.sql:/docker-entrypoint-initdb.d/01-init-edc-all.sql:ro
      - ${REPOS_DIR:-./repos}/ed-node/launchers/postgresql-init/02-init-vault-all.sql:/docker-entrypoint-initdb.d/02-init-vault-all.sql:ro
      - ${REPOS_DIR:-./repos}/ed-node/launchers/postgresql-init/03-init-identityhub-all.sql:/docker-entrypoint-initdb.d/03-init-identityhub-all.sql:ro
    environment:
      POSTGRES_DB: edc
      POSTGRES_USER: edc_user
      POSTGRES_PASSWORD: edc_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc_user -d edc"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  edc-vault-connector1:
    image: hashicorp/vault:1.15
    hostname: edc-vault-connector1
    container_name: edc-vault-connector1
    networks:
      edc-network:
        aliases:
          - edc-vault-connector1
    restart: unless-stopped
    depends_on:
      edc-postgres-connector1:
        condition: service_healthy
    environment:
      VAULT_SKIP_VERIFY: "true"
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/deployment/vault/connector1/vault-connector1-config.json:/vault/custom/local.json
      - vault_init_data_connector1:/vault
    cap_add:
      - IPC_LOCK
    command: "server -config=/vault/custom/local.json"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 2>&1 | grep -E '(Sealed.*false|Initialized.*true)' || echo 'Vault not ready'"]
      interval: 10s
      timeout: 35s
      retries: 30
      start_period: 20s

  edc-vault-init-connector1:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: launchers/vault-init/Dockerfile.vault-init
    image: unimaas/vault-init:1.0
    hostname: edc-vault-init-connector1
    container_name: edc-vault-init-connector1
    depends_on:
      edc-vault-connector1:
        condition: service_healthy
      edc-postgres-connector1:
        condition: service_healthy
    networks:
      edc-network:
        aliases:
          - edc-vault-init-connector1
    restart: "no"
    entrypoint: sh /vault/vault-init.sh http://edc-vault-connector1:8200 ${CONNECTOR1_DID:-did:web:edc-proxy-connector1%3A80:connector1} edc-postgres-connector1:5432
    volumes:
      - ${REPOS_DIR:-./repos}/ed-node/launchers/vault-init/vault-init.sh:/vault/vault-init.sh
      - ${REPOS_DIR:-./repos}/ed-node/deployment/assets/keysPrivPub/connector1/connector1_private.pem:/vault/keys/private-key.pem
      - ${REPOS_DIR:-./repos}/ed-node/deployment/assets/keysPrivPub/connector1/connector1_public.pem:/vault/keys/certificate.pem
      - vault_init_data_connector1:/vault

  edc-vault-autounseal-connector1:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: launchers/vault-autounseal/Dockerfile.vault-autounseal
    image: unimaas/vault-autounseal:1.0
    hostname: edc-vault-autounseal-connector1
    container_name: edc-vault-autounseal-connector1
    depends_on:
      edc-vault-connector1:
        condition: service_started
      edc-vault-init-connector1:
        condition: service_completed_successfully
    networks:
      edc-network:
        aliases:
          - edc-vault-autounseal-connector1
    restart: unless-stopped
    environment:
      - VAULT_ADDR=http://edc-vault-connector1:8200
      - CHECK_INTERVAL=10
    volumes:
      - vault_init_data_connector1:/vault:ro
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q autounseal.sh || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ih-connector1:
    build:
      context: ${REPOS_DIR:-./repos}/ed-node
      dockerfile: launchers/identity-hub/src/main/docker/Dockerfile_identityhub
    image: unimaas/edc-identityhub:1.0
    hostname: edc-ih-connector1
    container_name: edc-ih-connector1
    ports:
      - "7190:7090"
      - "7191:7091"
      - "7192:7092"
      - "7193:7093"
      - "7194:7094"
      - "7195:7095"
    networks:
      edc-network:
        aliases:
          - edc-ih-connector1
          - ih-connector1
    restart: unless-stopped
    depends_on:
      edc-postgres-connector1:
        condition: service_healthy
      edc-vault-connector1:
        condition: service_healthy
      edc-vault-init-connector1:
        condition: service_completed_successfully
      edc-proxy-issuerservicevc:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./scripts/ih-entrypoint.sh:/app/entrypoint.sh:ro
      - vault_init_data_connector1:/vault-token:ro
      - vault_init_data_connector1:/vault-identityhub-token:ro
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - UNIMAAS_OIDC_IDP_REALM=${UNIMAAS_OIDC_IDP_REALM:-unimaas}
      - EDC_HOSTNAME=edc-ih-connector1
      - EDC_IAM_ISSUER_ID=${CONNECTOR1_DID:-did:web:edc-proxy-connector1%3A80:connector1}
      - EDC_IAM_DID_WEB_USE_HTTPS=false
      - EDC_IH_IAM_ID=${CONNECTOR1_DID:-did:web:edc-proxy-connector1%3A80:connector1}
      - EDC_PARTICIPANT_ID=${CONNECTOR1_DID:-did:web:edc-proxy-connector1%3A80:connector1}
      - EDC_IH_API_SUPERUSER_KEY=${IH_API_KEY:-c3VwZXItdXNlcg==.c3VwZXItc2VjcmV0LWtleQo=}
      - EDC_IAM_STS_OAUTH_CLIENT_ID=${CONNECTOR1_DID:-did:web:edc-proxy-connector1%3A80:connector1}
      - EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS=${CONNECTOR1_DID:-did:web:edc-proxy-connector1%3A80:connector1}-sts-client-secret
      - EDC_LOG_LEVEL=DEBUG
      - EDC_WEB_REST_CORS_ENABLED=true
      - EDC_MONITOR_LEVEL=DEBUG
      - EDC_VAULT_HASHICORP_URL=http://edc-vault-connector1:8200
      - EDC_VAULT_CERTIFICATE_RESOLVER_ENABLED=true
      - EDC_VAULT_PRIVATEKEY_RESOLVER_ENABLED=true
      - UNIMAAS_ISSUERSERVICEVC_PROTOCOL=${UNIMAAS_ISSUERSERVICEVC_PROTOCOL:-http}
      - UNIMAAS_ISSUERSERVICEVC_HOST=${UNIMAAS_ISSUERSERVICEVC_HOST:-edc-proxy-issuerservicevc}
      - UNIMAAS_ISSUERSERVICEVC_PORT=${UNIMAAS_ISSUERSERVICEVC_PORT:-80}
      - UNIMAAS_ISSUERSERVICEVC_PATH=${UNIMAAS_ISSUERSERVICEVC_PATH:-/api/v1/issue-credential}
      - UNIMAAS_ISSUERSERVICEVC_DID=${UNIMAAS_ISSUERSERVICEVC_DID:-did:web:edc-proxy-issuerservicevc%3A80:issuerservicevc}
      - GAIAX_ISSUERSERVICEVC_PORT=${GAIAX_ISSUERSERVICEVC_PORT:-80}
      - GAIAX_ISSUERSERVICEVC_PATH=${GAIAX_ISSUERSERVICEVC_PATH:-/api/v1/issue-gaiax-credential-jwt}
      - UNIMAAS_OIDC_IDP_PROTOCOL=${UNIMAAS_OIDC_IDP_PROTOCOL:-http}
      - UNIMAAS_OIDC_IDP_HOST=${UNIMAAS_OIDC_IDP_HOST:-keycloak}
      - UNIMAAS_OIDC_IDP_PORT=${UNIMAAS_OIDC_IDP_PORT:-8080}
      - UNIMAAS_OIDC_IDP_PATH=${UNIMAAS_OIDC_IDP_PATH:-/realms/unimaas/protocol/openid-connect/token}
      - UNIMAAS_OIDC_IDP_CLIENT_ID=${CONNECTOR1_DID:-did:web:edc-proxy-connector1%3A80:connector1}
      - UNIMAAS_OIDC_IDP_CLIENT_SECRET=${CONNECTOR1_OIDC_SECRET:-connector1-secret}
      - UNIMAAS_CREDENTIALS_MEMBERSHIP_DUPLICATE_STRATEGY=${UNIMAAS_CREDENTIALS_MEMBERSHIP_DUPLICATE_STRATEGY:-REPLACE_ALWAYS}
      - UNIMAAS_CREDENTIALS_DATAPROCESSOR_DUPLICATE_STRATEGY=${UNIMAAS_CREDENTIALS_DATAPROCESSOR_DUPLICATE_STRATEGY:-REPLACE_ALWAYS}
      - UNIMAAS_CREDENTIALS_GAIAX_DUPLICATE_STRATEGY=${UNIMAAS_CREDENTIALS_GAIAX_DUPLICATE_STRATEGY:-REPLACE_ALWAYS}
      - UNIMAAS_CREDENTIALS_RENEWAL_ENABLED=${UNIMAAS_CREDENTIALS_RENEWAL_ENABLED:-true}
      - UNIMAAS_CREDENTIALS_RENEWAL_CHECK_INTERVAL_MINUTES=${UNIMAAS_CREDENTIALS_RENEWAL_CHECK_INTERVAL_MINUTES:-1440}
      - UNIMAAS_CREDENTIALS_RENEWAL_EXPIRY_THRESHOLD_DAYS=${UNIMAAS_CREDENTIALS_RENEWAL_EXPIRY_THRESHOLD_DAYS:-30}
